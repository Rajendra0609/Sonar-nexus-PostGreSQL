# ============================================================================
# PRODUCTION MANIFEST: PostgreSQL (StatefulSet) + SonarQube + Nexus (Deployments)
# ============================================================================
# BEFORE YOU APPLY THIS FILE, EDIT THE FOLLOWING:
#
#   1. StorageClass "nfs-storage" (below)        -> set your NFS server IP/host + export path
#      (or delete the StorageClass block and set storageClassName to an
#       NFS StorageClass that already exists in your cluster)
#   2. Secret "postgresql-secret"                -> set real DB username/password
#   3. Ingress hostnames (sonarqube.example.com / nexus.example.com) -> your real domains
#   4. Storage sizes (storage: 20Gi / 10Gi / 50Gi etc.) -> per your capacity planning
#   5. Image tags (postgres:16.4-alpine, sonarqube:10.6.0-community,
#      sonatype/nexus3:3.70.1) -> pin to versions you've validated
#   6. Resource requests/limits -> tune to your actual node sizes and workload
#
# Apply with:  kubectl apply -f k8s-sonarqube-nexus-postgresql.yaml
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: devops-tools
  labels:
    name: devops-tools

---
# ============================================================================
# STORAGE — NFS StorageClass (EDIT THIS SECTION)
# ============================================================================
# This assumes the Kubernetes CSI NFS driver (nfs.csi.k8s.io) is installed
# in your cluster. If you already have an NFS-backed StorageClass, delete
# this block and just change `storageClassName: nfs-storage` everywhere
# below to your existing StorageClass name instead.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-storage
provisioner: nfs.csi.k8s.io          # <-- CHANGE if using a different NFS provisioner
parameters:
  server: 172.16.0.5  # <-- CHANGE: e.g. 10.10.1.50
  share: /opt/sonar      # <-- CHANGE: your NFS export path
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true

---
# ============================================================================
# SECRETS (EDIT: set real credentials before applying)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: devops-tools
type: Opaque
stringData:
  POSTGRES_USER: sonarUser
  POSTGRES_PASSWORD: sonarPass
  POSTGRES_DB: sonarqube

---
# ============================================================================
# POSTGRESQL — StatefulSet (stateful, 1 replica primary)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: devops-tools
  labels:
    app: postgresql
spec:
  clusterIP: None            # headless service required for StatefulSet
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: devops-tools
  labels:
    app: postgresql
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgresql
          envFrom:
            - secretRef:
                name: postgresql-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs-storage
        resources:
          requests:
            storage: 20Gi

---
# ============================================================================
# SONARQUBE — Deployment (stateless pod, persistent data on NFS-backed PVCs)
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
  namespace: devops-tools
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-extensions
  namespace: devops-tools
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-logs
  namespace: devops-tools
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-config
  namespace: devops-tools
data:
  SONAR_JDBC_URL: "jdbc:postgresql://postgresql.devops-tools.svc.cluster.local:5432/sonarqube"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: devops-tools
  labels:
    app: sonarqube
spec:
  replicas: 1
  strategy:
    type: Recreate    # avoid two instances writing to the same data volume
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      initContainers:
        # Elasticsearch (bundled in SonarQube) requires this kernel setting,
        # otherwise SonarQube will crash-loop on startup in production.
        - name: sysctl
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - >
              sysctl -w vm.max_map_count=524288 &&
              sysctl -w fs.file-max=131072 &&
              ulimit -n 131072 &&
              ulimit -u 8192
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /opt/sonarqube/data /opt/sonarqube/extensions /opt/sonarqube/logs"]
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
            - name: sonarqube-extensions
              mountPath: /opt/sonarqube/extensions
            - name: sonarqube-logs
              mountPath: /opt/sonarqube/logs
      containers:
        - name: sonarqube
          image: sonarqube:26.8.0.126808-community
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: http
          envFrom:
            - configMapRef:
                name: sonarqube-config
          env:
            - name: SONAR_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_USER
            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: SONAR_WEB_JAVAOPTS
              value: "-Xmx1024m -Xms512m"
            - name: SONAR_CE_JAVAOPTS
              value: "-Xmx1024m -Xms512m"
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
            - name: sonarqube-extensions
              mountPath: /opt/sonarqube/extensions
            - name: sonarqube-logs
              mountPath: /opt/sonarqube/logs
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: sonarqube-data
          persistentVolumeClaim:
            claimName: sonarqube-data
        - name: sonarqube-extensions
          persistentVolumeClaim:
            claimName: sonarqube-extensions
        - name: sonarqube-logs
          persistentVolumeClaim:
            claimName: sonarqube-logs

---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: devops-tools
  labels:
    app: sonarqube
spec:
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30900        # <-- CHANGE if you want a different port (valid range: 30000-32767)
  type: NodePort

---
# ============================================================================
# NEXUS — Deployment (stateless pod, persistent data on NFS-backed PVC)
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: devops-tools
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: devops-tools
  labels:
    app: nexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      initContainers:
        # Nexus runs as UID 200 inside the container; the mounted NFS volume
        # needs matching ownership or Nexus will fail to write data.
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 200:200 /nexus-data"]
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
      containers:
        - name: nexus
          image: sonatype/nexus3:3.70.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: "-Xms1200m -Xmx1200m -XX:MaxDirectMemorySize=2g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /service/rest/v1/status
              port: 8081
            failureThreshold: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 30
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-data

---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: devops-tools
  labels:
    app: nexus
spec:
  selector:
    app: nexus
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30810         # <-- CHANGE if you want a different port (valid range: 30000-32767)
    - name: docker-registry    # remove if you don't host a Docker registry repo in Nexus
      port: 5000
      targetPort: 5000
      nodePort: 30500         # <-- CHANGE if you want a different port (valid range: 30000-32767)
  type: NodePort

---
# ============================================================================
# INGRESS (OPTIONAL — EDIT hostnames / remove cert-manager annotation if unused)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-tools-ingress
  namespace: devops-tools
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    cert-manager.io/cluster-issuer: letsencrypt-prod   # remove if not using cert-manager
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sonarqube.example.com
        - nexus.example.com
      secretName: devops-tools-tls
  rules:
    - host: sonarqube.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  number: 9000
    - host: nexus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus
                port:
                  number: 8081
