version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: postgres_sonar
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./postgres/data:/var/lib/postgresql
    mem_limit: 512M
    memswap_limit: 1G
    networks:
      - sonar-nexus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    env_file:
      - .env

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: always
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SONAR_JDBC_USERNAME=${POSTGRES_USER}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD}
      - SONAR_WEB_JVM_OPTS=${SONAR_WEB_JVM_OPTS}
      - SONAR_CE_JVM_OPTS=${SONAR_CE_JVM_OPTS}
      - SONAR_SEARCH_JVM_OPTS=${SONAR_SEARCH_JVM_OPTS}
    env_file:
      - .env
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    mem_limit: 2G
    memswap_limit: 3G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 4096
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sonar-nexus

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:

networks:
  sonar-nexus:
    driver: bridge
